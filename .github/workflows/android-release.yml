name: Android release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          match = re.search(
              r'^version: (\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+(\d+)\s*$',
              Path('pubspec.yaml').read_text(),
              re.MULTILINE,
          )
          if not match:
              raise SystemExit('pubspec.yaml must contain version: x.y.z+buildNumber')
          version, build_number = match.groups()
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version} to match pubspec.yaml')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ARTIFACT_PREFIX=method-conf-{version}-{build_number}\n')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.47.9
          cache-sdk: true

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore_path="$RUNNER_TEMP/android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Install dependencies and generate code
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          cp lib/env.dart.example lib/env.dart
          dart run build_runner build

      - name: Build signed app bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          METHOD_BASE_URL: https://www.methodconf.com
          UMBRACO_BASE_URL: https://cms.methodconf.com
          PLAUSIBLE_SERVER_URL: https://plausible.sgf.dev
          PLAUSIBLE_DOMAIN: mobile.methodconf.com
          ENABLE_ERROR_TRACKING: 'true'
          ENABLE_ANALYTICS: 'true'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "::error::Missing required secret: SENTRY_DSN"
            exit 1
          fi
          defines=(
            "--dart-define=METHOD_BASE_URL=$METHOD_BASE_URL"
            "--dart-define=UMBRACO_BASE_URL=$UMBRACO_BASE_URL"
            "--dart-define=PLAUSIBLE_SERVER_URL=$PLAUSIBLE_SERVER_URL"
            "--dart-define=PLAUSIBLE_DOMAIN=$PLAUSIBLE_DOMAIN"
            "--dart-define=ENABLE_ERROR_TRACKING=$ENABLE_ERROR_TRACKING"
            "--dart-define=ENABLE_ANALYTICS=$ENABLE_ANALYTICS"
            "--dart-define=SENTRY_DSN=$SENTRY_DSN"
          )
          flutter build appbundle --release "${defines[@]}"
          flutter build apk --release "${defines[@]}"

      - name: Verify signatures and stage release assets
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose "$apk"
          # jarsigner can exit successfully for unsigned archives, so check its result text too.
          LC_ALL=C jarsigner -verify "$aab" | tee "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified\.' "$RUNNER_TEMP/aab-verification.txt"
          mkdir -p dist
          cp "$aab" "dist/$ARTIFACT_PREFIX.aab"
          cp "$apk" "dist/$ARTIFACT_PREFIX.apk"

      - name: Attach binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.aab dist/*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove signing key and app configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks" lib/env.dart
