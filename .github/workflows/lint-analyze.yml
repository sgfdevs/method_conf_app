name: Lint & Analyze
on:
  pull_request:
jobs:
  lint-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flutter-actions/setup-flutter@0e3ac53a5126c46be01612423cf26b5d59018adc # v5.0
        with:
          channel: stable
          version: 3.47.9
          cache-sdk: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: cp ./lib/env.dart.example ./lib/env.dart
      - run: dart run build_runner build
      - run: flutter analyze
