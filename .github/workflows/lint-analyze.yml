name: Lint & Analyze
on:
  pull_request:
jobs:
  lint-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: flutter-actions/setup-flutter@c7fdb36b173fc3e88e5c5a3733c2b66bd9ac91a1 # v3.7
        with:
          channel: stable
          version: 3.47.9
          cache-sdk: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: cp ./lib/env.dart.example ./lib/env.dart
      - run: dart run build_runner build
      - run: flutter analyze
